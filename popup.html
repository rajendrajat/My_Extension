<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Claude Token Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px;
      background: #0f0f1a;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 0 0 12px;
    }
    .header {
      background: linear-gradient(135deg, #2d1b69, #1e1b4b);
      padding: 14px 16px;
      border-bottom: 1px solid #3730a3;
    }
    .header h1 { font-size: 14px; color: #c4b5fd; font-weight: 700; letter-spacing: 0.5px; }
    .header p  { font-size: 10px; color: #6366f1; margin-top: 2px; }
    
    .stat-block { padding: 14px 16px; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .stat-row label { font-size: 11px; color: #94a3b8; }
    .stat-row span  { font-size: 13px; color: #c4b5fd; font-weight: 600; font-variant-numeric: tabular-nums; }

    .bar-wrap {
      background: #1e1b4b;
      border-radius: 6px; height: 10px; overflow: hidden;
      margin: 8px 0;
    }
    .bar {
      height: 100%; border-radius: 6px;
      transition: width 0.4s ease;
      background: linear-gradient(90deg, #10b981, #34d399);
    }
    .bar.warn   { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .bar.danger { background: linear-gradient(90deg, #ef4444, #f87171); }

    .pct-label { text-align: right; font-size: 11px; color: #64748b; margin-top: 2px; }

    .info { padding: 0 16px; font-size: 10px; color: #475569; line-height: 1.5; }
    .tip  { background: #1e1b4b; border-radius: 8px; padding: 8px 10px; margin: 10px 16px 0; font-size: 10px; color: #a78bfa; line-height: 1.5; }
    .tip strong { color: #c4b5fd; }

    .not-claude { padding: 16px; text-align: center; color: #64748b; font-size: 12px; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #10b981; margin-right: 5px; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔢 Claude Token Tracker</h1>
    <p>Context window monitor</p>
  </div>

  <div id="content">
    <div class="not-claude">Open <strong>claude.ai</strong> to see token stats</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
